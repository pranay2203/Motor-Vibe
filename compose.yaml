services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorvibe}
      POSTGRES_USER: ${POSTGRES_USER:-motorvibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-motorvibe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-motorvibe}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TELEMETRY_SERVICE_TOKEN: ${TELEMETRY_SERVICE_TOKEN:?Set TELEMETRY_SERVICE_TOKEN in .env}
      CLIENT_ORIGIN: http://localhost:8080
      MQTT_URL: ""
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/telemetry-worker.js"]
    environment:
      MQTT_URL: mqtt://mqtt:1883
      MQTT_TOPIC: motorvibe/+/telemetry
      API_INTERNAL_URL: http://api:4000
      TELEMETRY_SERVICE_TOKEN: ${TELEMETRY_SERVICE_TOKEN:?Set TELEMETRY_SERVICE_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  mqtt-data:
